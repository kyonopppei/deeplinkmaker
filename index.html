<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Deeplink URL Generator with Templates</title>
  <style>
    body {
      background: #1e1e2f;
      color: #e0e0f0;
    }

    .container {
      background: #2a2a3d;
      color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
    }

    h1 {
      color: #66ffff;
    }

    input, select {
      background-color: #33334d;
      color: #ffffff;
      border: 1px solid #555;
      padding: 0.5rem;
      border-radius: 6px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #66ffff;
      box-shadow: 0 0 6px #66ffff;
    }

    button {
      background: linear-gradient(to right, #66ffff, #3399ff);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(102, 255, 255, 0.3);
    }

    button:hover {
      background: linear-gradient(to right, #3399ff, #66ffff);
      box-shadow: 0 0 15px rgba(102, 255, 255, 0.6);
    }

    table {
      background-color: #2a2a3d;
      border-collapse: collapse;
    }

    th {
      background-color: #3a3a5c;
      color: #ffffff;
    }

    td {
      border: 1px solid #444;
    }

    .url-block {
      background: #2e2e44;
      border: 1px solid #555;
      border-radius: 8px;
      margin-bottom: 1rem;
      padding: 1rem;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ccf;
    }

    .url-block img {
      border: 2px solid #66ffff;
      border-radius: 4px;
    }

    .url-details {
      flex-grow: 1;
    }

    pre {
      background: #1e1e2f;
      border-left: 4px solid #66ffff;
      padding: 1rem;
      border-radius: 8px;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(to right, #ffffff, #f7f7f7);
      margin: 0;
      padding: 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }

    td input {
      width: 100%;
      border: none;
      padding: 6px;
      background: #f9f9f9;
    }

    button {
      padding: 0.6rem 1.2rem;
      margin: 0.5rem 0.5rem 1rem 0;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      color: white;
      cursor: pointer;
    }

    pre {
      background: #f4f4f4;
      padding: 1rem;
      border-left: 4px solid #4facfe;
      white-space: pre-wrap;
    }

    .url-block {
      margin-bottom: 1rem;
      background: #fff;
      padding: 1rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .url-block img {
      width: 80px;
      height: auto;
      border: 1px solid #ccc;
    }

    .url-details {
      flex-grow: 1;
    }

    input[type='file'] {
      margin-top: 1rem;
      margin-bottom: 1rem;
    }

    select {
      margin-bottom: 1rem;
      padding: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deeplink URL Generator + バナー + テンプレート</h1>

    
    <label>テンプレート:</label>
    <select id="templateSelect" onchange="loadTemplateFromStorage()">
      <option value="">テンプレートを選択</option>
    </select>
    <input type="text" id="templateName" placeholder="テンプレート名を入力" />
    <button onclick="saveCurrentAsTemplate()">💾 保存</button>
    <button onclick="deleteSelectedTemplate()">❌ 削除</button>
  
      <option value="">テンプレートを選択</option>
      <option value="template1">Tiktok - kumo</option>
      <option value="template2">Meta - vivid</option>
    </select>

    <button onclick="addRow()">＋ 行を追加</button>
    <button onclick="clearAll()">クリア</button>
    <br><br>

    <table id="inputTable">
      <thead>
        <tr>
          <th>source</th>
          <th>appid</th>
          <th>campaign</th>
          <th>adgroup</th>
        </tr>
      </thead>
      <tbody>
        <tr><td><input onpaste="handlePaste(event)"></td><td><input></td><td><input></td><td><input></td></tr>
      </tbody>
    </table>

    <label>バナー画像をアップロード（複数可）</label><br>
    <input type="file" id="bannerFiles" multiple><br>

    <button onclick="generateUrls()">URLを生成</button>
    <button onclick="copyAllUrls()">全体コピー</button>
    <button onclick="downloadCSV()">CSVでDL</button>

    <div id="output"></div>
  </div>

  <script>
    const templates = {
      template1: [
        { source: "tiktok", appid: "kumo", campaign: "kumo_campaign", adgroup: "cr_kumo_all" }
      ],
      template2: [
        { source: "meta", appid: "vivid", campaign: "vivid_campaign", adgroup: "vivid_ad" }
      ]
    };

    function handlePaste(e) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text');
      const rows = text.split('\n').map(r => r.split('\t'));
      const startCell = e.target.closest('td');
      const startRow = Array.from(document.querySelectorAll('#inputTable tbody tr')).indexOf(startCell.parentElement);
      const startCol = Array.from(startCell.parentElement.children).indexOf(startCell);

      const allRows = document.querySelectorAll('#inputTable tbody tr');

      rows.forEach((rowData, i) => {
        const targetRow = allRows[startRow + i];
        if (!targetRow) return;

        rowData.forEach((cellData, j) => {
          const targetCell = targetRow.children[startCol + j];
          if (targetCell && targetCell.firstElementChild) {
            targetCell.firstElementChild.value = cellData;
          }
        });
      });
    }

    function addRow() {
      const tbody = document.querySelector('#inputTable tbody');
      const row = document.createElement('tr');
      for (let i = 0; i < 4; i++) {
        const td = document.createElement('td');
        const input = document.createElement('input');
        input.setAttribute('onpaste', 'handlePaste(event)');
        td.appendChild(input);
        row.appendChild(td);
      }
      tbody.appendChild(row);
    }

    function clearAll() {
      document.querySelector('#inputTable tbody').innerHTML = '';
      addRow();
      document.getElementById('bannerFiles').value = '';
      document.getElementById('output').innerHTML = '';
    }

    function loadTemplate() {
      const value = document.getElementById('templateSelect').value;
      if (!templates[value]) return;
      const tbody = document.querySelector('#inputTable tbody');
      tbody.innerHTML = '';
      templates[value].forEach(rowData => {
        const tr = document.createElement('tr');
        ['source', 'appid', 'campaign', 'adgroup'].forEach(key => {
          const td = document.createElement('td');
          const input = document.createElement('input');
          input.value = rowData[key];
          td.appendChild(input);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function generateUrls() {
      const rows = document.querySelectorAll('#inputTable tbody tr');
      const banners = document.getElementById('bannerFiles').files;
      const output = document.getElementById('output');
      output.innerHTML = '';
      const all = [];

      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        if ([...inputs].some(input => input.value.trim() === '')) return;

        const [source, appid, campaign, adgroup] = [...inputs].map(input => encodeURIComponent(input.value.trim()));

        for (let i = 0; i < banners.length; i++) {
          const file = banners[i];
          const content = encodeURIComponent(file.name);
          const url = `https://platform-sc.g123.jp/micro-app/auxin/landing-page/deeplink.html?callback=h5.g123.jp%2Fgame%2F${appid}%3Fplatform%3Dauto%26utm_source%3D${source}%26utm_campaign%3D${campaign}%26utm_adgroup%3D${adgroup}%26lang%3Dja%26utm_content%3D${content}`;
          all.push([decodeURIComponent(campaign), decodeURIComponent(adgroup), file.name, url]);

          const div = document.createElement('div');
          div.className = 'url-block';
          div.innerHTML = `
            <img src="${URL.createObjectURL(file)}" alt="${file.name}">
            <div class="url-details">
              <strong>キャンペーン:</strong> ${decodeURIComponent(campaign)}<br>
              <strong>アドグループ:</strong> ${decodeURIComponent(adgroup)}<br>
              <strong>ファイル名:</strong> ${file.name}<br>
              <code>${url}</code>
            </div>
            <button onclick="copySingleUrl('${url}')">コピー</button>
          `;
          output.appendChild(div);
        }
      });

      output.dataset.csv = JSON.stringify(all);
    }

    function copySingleUrl(url) {
      navigator.clipboard.writeText(url).then(() => alert('コピーしました'));
    }

    function copyAllUrls() {
      const rows = JSON.parse(document.getElementById('output').dataset.csv || '[]');
      const urls = rows.map(r => r[3]).join('\n');
      navigator.clipboard.writeText(urls).then(() => alert('全体をコピーしました'));
    }

    function downloadCSV() {
      const rows = JSON.parse(document.getElementById('output').dataset.csv || '[]');
      let csv = 'キャンペーン,アドグループ,ファイル名,URL\n';
      rows.forEach(r => {
        csv += r.map(item => `"${item.replace(/"/g, '""')}"`).join(',') + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'deeplinks.csv';
      a.click();
    }
  
    // localStorage版テンプレ管理
    const templateKey = "deeplinkTemplates";

    function saveCurrentAsTemplate() {
      const name = document.getElementById('templateName').value.trim();
      if (!name) return alert("テンプレート名を入力してください");
      const rows = document.querySelectorAll('#inputTable tbody tr');
      const data = [];
      rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        if ([...inputs].some(i => i.value.trim() === '')) return;
        data.push({
          source: inputs[0].value.trim(),
          appid: inputs[1].value.trim(),
          campaign: inputs[2].value.trim(),
          adgroup: inputs[3].value.trim()
        });
      });
      const templates = JSON.parse(localStorage.getItem(templateKey) || '{}');
      templates[name] = data;
      localStorage.setItem(templateKey, JSON.stringify(templates));
      populateTemplateList();
      alert("テンプレートを保存しました");
    }

    function loadTemplateFromStorage() {
      const selected = document.getElementById('templateSelect').value;
      if (!selected) return;
      const templates = JSON.parse(localStorage.getItem(templateKey) || '{}');
      const data = templates[selected];
      if (!data) return;
      const tbody = document.querySelector('#inputTable tbody');
      tbody.innerHTML = '';
      data.forEach(rowData => {
        const tr = document.createElement('tr');
        ['source', 'appid', 'campaign', 'adgroup'].forEach(key => {
          const td = document.createElement('td');
          const input = document.createElement('input');
          input.value = rowData[key];
          input.setAttribute('onpaste', 'handlePaste(event)');
          td.appendChild(input);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    }

    function deleteSelectedTemplate() {
      const selected = document.getElementById('templateSelect').value;
      if (!selected) return;
      const templates = JSON.parse(localStorage.getItem(templateKey) || '{}');
      if (!templates[selected]) return;
      if (!confirm(`本当に「${selected}」を削除しますか？`)) return;
      delete templates[selected];
      localStorage.setItem(templateKey, JSON.stringify(templates));
      populateTemplateList();
      alert("削除しました");
    }

    function populateTemplateList() {
      const select = document.getElementById('templateSelect');
      const templates = JSON.parse(localStorage.getItem(templateKey) || '{}');
      select.innerHTML = '<option value="">テンプレートを選択</option>';
      Object.keys(templates).forEach(name => {
        const option = document.createElement('option');
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
      });
    }

    document.addEventListener('DOMContentLoaded', populateTemplateList);
  </script>

</body>
</html>
